services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: htecl_test
      MARIADB_USER: htecl_test
      MARIADB_PASSWORD: local-test-only
      MARIADB_ROOT_PASSWORD: local-test-admin-only
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
